[package]
name = "square-flute"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "What other LaserMadeMusic generators borrow from this repository, in Rust"
license-file = "LICENSE"
publish = false
autobins = false

# A library only: the Rust generators beside this checkout (panpipes,
# practice-chanters, ghb-chanter, uilleann-chanter) depend on it by path.
# This repository's own generators are still Python.
[lib]
name = "square_flute"
path = "square_flute.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }
