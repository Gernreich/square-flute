<!-- DISPLAY ONLY - not a cut file.
     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="591.93" height="261.72" fill="#ffffff"/>
<title>Square-bore flute in A4, stack-rect-3-nest-flue, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Square-bore flute in A4 with the 2017 flute's ideas: stack-rect-3-nest-flue, sheet 1 of 1: bird layer, bore layer, bottom layer, mouthpiece cap, top plate. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves: the part numbers, the flue as a fill engrave about 1mm deep over the plug, and the depression round each finger hole, a greyscale image engrave to set to depth on scrap. File the window's far edge to a bevel by hand. Orange #ff8000 cuts the holes and the window, black #000000 frees the parts.</desc>
