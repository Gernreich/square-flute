     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="585.19" height="282.5" fill="#ffffff"/>
<title>Square-bore flute in A4, stack-rect-6, sheet 1 of 2</title>
<desc>1 user unit = 1mm. Square-bore flute in A4, stack-rect-6, sheet 1 of 2: bird layer, bore layer, bottom layer, mouthpiece cap, top plate. 3mm ply, drawn for a 0.13mm kerf. Finger joints as the trumpet bores cut them: 6mm fingers and spaces, no play, the fit from the kerf. Blue #0000ff engraves (the part numbers; the flue as a fill engrave about 1mm deep; and the depression round each finger hole, a greyscale image engrave, Grayscale mode in xTool Creative Space -- set both depths on scrap first), orange #ff8000 cuts the holes and slots, black #000000 frees the parts.</desc>
