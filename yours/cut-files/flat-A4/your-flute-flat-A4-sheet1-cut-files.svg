<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="597.85mm" height="130.98mm" viewBox="0 0 597.85 130.98">
<title>The author's flute, flat-A4, sheet 1 of 1</title>
<desc>1 user unit = 1mm. The author's 2017 flute, redrawn: flat-A4, sheet 1 of 1: block layer, bottom plate, mouthpiece cap, plug disc, side wall, top plate. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves: the part numbers, the flue as a fill engrave about 1mm deep over the plug, and the depression round each finger hole, a greyscale image engrave to set to depth on scrap. File the window's far edge to a bevel by hand. Orange #ff8000 cuts the holes and the window, black #000000 frees the parts.</desc>
