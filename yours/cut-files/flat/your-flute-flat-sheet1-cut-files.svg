<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="590.75mm" height="151.16mm" viewBox="0 0 590.75 151.16">
<title>The author's flute, flat, sheet 1 of 1</title>
<desc>1 user unit = 1mm. The author's 2017 flute, redrawn: flat, sheet 1 of 1: block layer, bottom plate, mouthpiece cap, plug disc, side wall, top plate. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves: the part numbers, the flue as a fill engrave about 1mm deep over the plug, and the two greyscale images, the splitting-edge ramp beside the window and the depression round each finger hole, which need an image engrave set to depth on scrap. Orange #ff8000 cuts the holes and the window, black #000000 frees the parts.</desc>
