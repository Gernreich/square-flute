<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="593.18mm" height="129.06mm" viewBox="0 0 593.18 129.06">
<title>Square-bore flute in A4, box-square-6-bird-flue-flat, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Square-bore flute in A4, box-square-6-bird-flue-flat, sheet 1 of 1: bird layer, bottom plate, doubler, mouthpiece cap, plug disc, side wall, top plate. 3mm ply, drawn for a 0.13mm kerf. Finger joints as the trumpet bores cut them: 6mm fingers and spaces, no play, the fit from the kerf. Red #ff0000 scores the part numbers, lightly. Blue #0000ff engraves (the flue as a fill engrave about 1mm deep; and the depression round each finger hole, a greyscale image engrave, Grayscale mode in xTool Creative Space -- set both depths on scrap first), orange #ff8000 cuts the holes and slots, black #000000 frees the parts.</desc>
