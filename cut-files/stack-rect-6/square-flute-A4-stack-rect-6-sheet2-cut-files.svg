<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="477.83mm" height="75.12mm" viewBox="0 0 477.83 75.12">
<title>Square-bore flute in A4, stack-rect-6, sheet 2 of 2</title>
<desc>1 user unit = 1mm. Square-bore flute in A4, stack-rect-6, sheet 2 of 2: bore layer, doubler. 3mm ply, drawn for a 0.13mm kerf. Finger joints as the trumpet bores cut them: 6mm fingers and spaces, no play, the fit from the kerf. Blue #0000ff engraves (the part numbers, and the flue as a fill engrave about 1mm deep -- set its depth on scrap first), orange #ff8000 cuts the holes and slots, black #000000 frees the parts.</desc>
