<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="593.18mm" height="129.06mm" viewBox="0 0 593.18 129.06">
<title>Square-bore flute in A4, box-square-6-nest-flue-flat, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Square-bore flute in A4 with the 2017 flute's ideas: box-square-6-nest-flue-flat, sheet 1 of 1: bird layer, bottom plate, doubler, mouthpiece cap, plug disc, side wall, top plate. 3mm ply, drawn for a 0.13mm kerf. Red #ff0000 scores the part numbers, lightly. Blue #0000ff engraves: the flue as a fill engrave about 1mm deep over the plug, and the depression round each finger hole, a greyscale image engrave to set to depth on scrap. File the window's far edge to a bevel by hand. Orange #ff8000 cuts the holes and the window, black #000000 frees the parts.</desc>
