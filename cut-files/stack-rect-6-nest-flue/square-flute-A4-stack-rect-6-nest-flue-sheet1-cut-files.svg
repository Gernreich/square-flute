<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="589.79mm" height="293.68mm" viewBox="0 0 589.79 293.68">
<title>Square-bore flute in A4, stack-rect-6-nest-flue, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Square-bore flute in A4 with the 2017 flute's ideas: stack-rect-6-nest-flue, sheet 1 of 1: bird layer, bore layer, bottom layer, doubler, mouthpiece cap, top plate. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves: the flue as a fill engrave about 1mm deep over the plug, and the depression round each finger hole, a greyscale image engrave to set to depth on scrap. File the window's far edge to a bevel by hand. Orange #ff8000 cuts the holes and the window, black #000000 frees the parts.</desc>
