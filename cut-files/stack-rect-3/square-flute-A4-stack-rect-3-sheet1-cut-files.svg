<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="586.87mm" height="282.50mm" viewBox="0 0 586.87 282.50">
<title>Square-bore flute in A4, stack-rect-3, sheet 1 of 2</title>
<desc>1 user unit = 1mm. Square-bore flute in A4, stack-rect-3, sheet 1 of 2: bird layer, bore layer, bottom layer, mouthpiece cap, top plate. 3mm ply, drawn for a 0.13mm kerf. Finger joints as the trumpet bores cut them: 6mm fingers and spaces, no play, the fit from the kerf. Blue #0000ff engraves (the part numbers; the flue as a fill engrave about 1mm deep; and the depression round each finger hole, a greyscale image engrave, Grayscale mode in xTool Creative Space -- set both depths on scrap first), orange #ff8000 cuts the holes and slots, black #000000 frees the parts.</desc>
