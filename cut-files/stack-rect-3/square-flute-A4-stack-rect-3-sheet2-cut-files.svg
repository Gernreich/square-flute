<title>Square-bore flute in A4, stack-rect-3, sheet 2 of 2</title>
<desc>1 user unit = 1mm. Square-bore flute in A4, stack-rect-3, sheet 2 of 2: top, body plate, top, head plate. 3mm ply, drawn for a 0.13mm kerf, joints 0.19mm tight along a tab and 0.12mm across. Blue #0000ff engraves (the part numbers, and the flue as a fill engrave about 1mm deep -- set its depth on scrap first), orange #ff8000 cuts the holes and slots, black #000000 frees the parts.</desc>
