<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="586.87mm" height="282.50mm" viewBox="0 0 586.87 282.50">
<title>Square-bore flute in A4, stack-rect-3-plus, sheet 1 of 2</title>
<desc>1 user unit = 1mm. Square-bore flute in A4 with the 2017 flute's ideas: stack-rect-3-plus, sheet 1 of 2: bird layer, bore layer, bottom layer, mouthpiece cap. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves: the part numbers, the flue as a fill engrave about 1mm deep over the plug, and the depression round each finger hole, a greyscale image engrave to set to depth on scrap. File the window's far edge to a bevel by hand. Orange #ff8000 cuts the holes and the window, black #000000 frees the parts.</desc>
